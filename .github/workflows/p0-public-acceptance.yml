name: Phase P0 public production acceptance

on:
  pull_request:
    paths:
      - 'tests/p0-public-acceptance.mjs'
      - 'tests/p0-edge-persistent.mjs'
      - '.github/workflows/p0-public-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-readonly:
    name: Public DNS, browser and recovery (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runner
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install fresh Chromium
        run: npx playwright install --with-deps chromium
      - name: Probe public Phase without affecting user storage
        run: node tests/p0-public-acceptance.mjs
        env:
          PHASE_PUBLIC_URL: https://phase.aerovista.us
      - name: Install Microsoft Edge for regular-profile acceptance
        run: npx playwright install --with-deps msedge
      - name: Exercise synthetic persisted map across Edge restart
        run: node tests/p0-edge-persistent.mjs
      - name: Preserve public domain evidence (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-p0-public-acceptance-${{ github.run_id }}
          path: |
            test-results/p0-public-acceptance/
            test-results/p0-edge-persistent/*.json
            test-results/p0-edge-persistent/*.png
          if-no-files-found: warn
