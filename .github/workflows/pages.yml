name: Deploy Phase to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Phase syntax
        run: npm run check

      - name: Run Phase tests
        run: npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          enablement: true

      - name: Build static Phase bundle
        run: |
          mkdir -p _site
          cp index.html recovery.html styles.css ui-polish.css manifest.webmanifest sw.js _site/
          cp -R icons js _site/
          if [ -f CNAME ]; then cp CNAME _site/CNAME; fi
          VERSION=$(grep -oE 'ALPHA [0-9]+\.[0-9]+\.[0-9]+' index.html | head -1 | awk '{print $2}')
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{"version":"%s","commit":"%s","builtAt":"%s"}\n' "$VERSION" "$GITHUB_SHA" "$BUILT_AT" > _site/build.json
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
